subscriptions:
  interface-stats:
    paths:
      - /interfaces/interface/state/counters
    mode: stream
    stream-mode: sample
    sample-interval: 5s

  interface-oper-status:
    paths:
      - /interfaces/interface[name=*]/state/oper-status
    mode: stream
    stream-mode: on_change
    sample-interval: 10s

  process-cpu:
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    paths:
      - /openconfig-system:system/processes/process/state/cpu-usage-system
      - /openconfig-system:system/processes/process/state/cpu-usage-user
      - /openconfig-system:system/processes/process/state/cpu-utilization

  process-mem:
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    paths:
      - /openconfig-system:system/processes/process/state/memory-usage
      - /openconfig-system:system/processes/process/state/memory-utilization

  system-utilization:
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    paths:
      - /openconfig-system:system/cpus/cpu[index=ALL]/state/openconfig-system:total
      - /openconfig-system:system/cpus/cpu[index=ALL]/state/openconfig-system:user
      - /openconfig-system:system/memory/openconfig-system:state

  bgp-state:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /openconfig-network-instance:network-instances/network-instance[name=default]/protocols/protocol/bgp/neighbors/neighbor/state/session-state
      - /openconfig-network-instance:network-instances/network-instance[name=default]/protocols/protocol/bgp/neighbors/neighbor/state/messages
      - /openconfig-network-instance:network-instances/network-instance[name=*]/protocols/protocol/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes/received
      - /openconfig-network-instance:network-instances/network-instance[name=*]/protocols/protocol/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes/sent

outputs:
  prom-output:
    type: prometheus
    listen: ":9273"
    strings-as-labels: true
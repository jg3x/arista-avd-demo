aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet49/1
  description: MLAG_s1-wifi-gw2_Ethernet49/1
  shutdown: false
  channel_group:
    id: 491
    mode: active
  peer: s1-wifi-gw2
  peer_interface: Ethernet49/1
  peer_type: mlag_peer
- name: Ethernet50/1
  description: MLAG_s1-wifi-gw2_Ethernet50/1
  shutdown: false
  channel_group:
    id: 491
    mode: active
  peer: s1-wifi-gw2
  peer_interface: Ethernet50/1
  peer_type: mlag_peer
- name: Ethernet1
  description: L2_s1-brdr1_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  peer: s1-brdr1
  peer_interface: Ethernet1
  peer_type: l3leaf
- name: Ethernet2
  description: L2_s1-brdr2_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  peer: s1-brdr2
  peer_interface: Ethernet1
  peer_type: l3leaf
flow_tracking:
  sampled:
    encapsulation:
      ipv4_ipv6: true
      mpls: false
    sample: 5000
    trackers:
    - record_export:
        on_inactive_timeout: 70000
        on_interval: 30000
      name: FLOW-TRACKER
      exporters:
      - name: CV-TELEMETRY
        collectors:
        - host: 127.0.0.1
        local_interface: Loopback0
        template_interval: 3600000
    shutdown: false
hostname: s1-wifi-gw1
ip_igmp_snooping:
  globally_enabled: true
load_interval:
  default: 1
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$arista$zo8APuuc.j2mn1Ic7FNXCUzUugtzyuFikDc5Q.Qi1RDei.U6dfH/MtlaKZJGmm6fKjD4GyYgQvVfCfYEqG1PT1
  ssh_key: ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBMq7V3lWrRkB0w63hdbG4gEZ8KuLFwf7cRv/3ln9GOU9nZhrfRHvLSRj9c07DvLi1aR/hBWkXBeKWLDMZurtcV8=
    avd@3b32407628ed
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: mgmt
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: mgmt
  ip_address: 192.168.0.102/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: 7050SX3
  fabric_name: SITE1_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_network_type
      value: campusV2
    - name: topology_hint_type
      value: Leaf
    - name: Role
      value: Leaf
    - name: Campus
      value: SITE1
    - name: Campus-Pod
      value: S1-POD01
    - name: Access-Pod
      value: S1-POD01-ACCESS
    interface_tags:
    - interface: Ethernet49/1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: MLAG
    - interface: Ethernet50/1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: MLAG
    - interface: Ethernet1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Uplink
    - interface: Ethernet2
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Uplink
    - interface: Management1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Management
mlag_configuration:
  domain_id: S1_WIFI_GW
  local_interface: Vlan4094
  peer_address: 10.251.1.1
  peer_link: Port-Channel491
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel491
  description: MLAG_s1-wifi-gw2_Port-Channel491
  shutdown: false
  flow_tracker:
    sampled: FLOW-TRACKER
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel1
  description: L2_S1_BRDR_Port-Channel1
  shutdown: false
  mlag: 1
  flow_tracker:
    sampled: FLOW-TRACKER
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 21,100-103
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
  no_spanning_tree_vlan: '4094'
static_routes:
- vrf: mgmt
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
- vrf: default
  destination_address_prefix: 0.0.0.0/0
  gateway: 10.21.21.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.251.1.0/31
  mtu: 9200
  no_autostate: true
- name: Vlan21
  description: WIFI-GW-Transit
  ip_address: 10.21.21.4/24
  ip_virtual_router_addresses:
  - 10.21.21.2/24
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  tenant: system
- id: 21
  name: WIFI-GW-Transit
  tenant: S1_FABRIC
- id: 100
  name: S1-WIFI-USER-1
  tenant: S1_FABRIC
- id: 101
  name: S1-WIFI-USER-2
  tenant: S1_FABRIC
- id: 102
  name: S1-WIFI-USER-3
  tenant: S1_FABRIC
- id: 103
  name: S1-WIFI-USER-4
  tenant: S1_FABRIC
vrfs:
- name: mgmt
  ip_routing: false

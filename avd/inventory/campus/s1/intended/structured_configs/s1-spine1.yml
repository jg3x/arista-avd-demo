aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1/1
  description: P2P_s1-leaf1_Ethernet51/1
  shutdown: false
  mtu: 9214
  ip_address: 172.16.1.0/31
  peer: s1-leaf1
  peer_interface: Ethernet51/1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet2/1
  description: P2P_s1-leaf2_Ethernet51/1
  shutdown: false
  mtu: 9214
  ip_address: 172.16.1.4/31
  peer: s1-leaf2
  peer_interface: Ethernet51/1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet3/1
  description: P2P_s1-leaf3_Ethernet51/1
  shutdown: false
  mtu: 9214
  ip_address: 172.16.1.8/31
  peer: s1-leaf3
  peer_interface: Ethernet51/1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet4/1
  description: P2P_s1-leaf4_Ethernet51/1
  shutdown: false
  mtu: 9214
  ip_address: 172.16.1.12/31
  peer: s1-leaf4
  peer_interface: Ethernet51/1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet31/1
  description: P2P_s1-brdr1_Ethernet51/1
  shutdown: false
  mtu: 9214
  ip_address: 172.16.1.16/31
  peer: s1-brdr1
  peer_interface: Ethernet51/1
  peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet32/1
  description: P2P_s1-brdr2_Ethernet51/1
  shutdown: false
  mtu: 9214
  ip_address: 172.16.1.20/31
  peer: s1-brdr2
  peer_interface: Ethernet51/1
  peer_type: l3leaf
  switchport:
    enabled: false
hostname: s1-spine1
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.250.1.1/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.10/24
  type: oob
metadata:
  is_deployed: true
  platform: cEOS
  pod_name: S1-POD01
  dc_name: SITE1
  fabric_name: SITE1_FABRIC
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.250.1.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 10.250.1.1
  maximum_paths:
    paths: 4
    ecmp: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 172.16.1.1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    peer: s1-leaf1
    description: s1-leaf1_Ethernet51/1
  - ip_address: 172.16.1.5
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    peer: s1-leaf2
    description: s1-leaf2_Ethernet51/1
  - ip_address: 172.16.1.9
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    peer: s1-leaf3
    description: s1-leaf3_Ethernet51/1
  - ip_address: 172.16.1.13
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    peer: s1-leaf4
    description: s1-leaf4_Ethernet51/1
  - ip_address: 172.16.1.17
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65103'
    peer: s1-brdr1
    description: s1-brdr1_Ethernet51/1
  - ip_address: 172.16.1.21
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65103'
    peer: s1-brdr2
    description: s1-brdr2_Ethernet51/1
  - ip_address: 10.250.1.7
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65103'
    peer: s1-brdr1
    description: s1-brdr1_Loopback0
  - ip_address: 10.250.1.8
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65103'
    peer: s1-brdr2
    description: s1-brdr2_Loopback0
  - ip_address: 10.250.1.3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    peer: s1-leaf1
    description: s1-leaf1_Loopback0
  - ip_address: 10.250.1.4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    peer: s1-leaf2
    description: s1-leaf2_Loopback0
  - ip_address: 10.250.1.5
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65102'
    peer: s1-leaf3
    description: s1-leaf3_Loopback0
  - ip_address: 10.250.1.6
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65102'
    peer: s1-leaf4
    description: s1-leaf4_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false

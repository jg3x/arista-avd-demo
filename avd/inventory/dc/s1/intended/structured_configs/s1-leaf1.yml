aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet49/1
  description: MLAG_s1-leaf2_Ethernet49/1
  shutdown: false
  channel_group:
    id: 491
    mode: active
  peer: s1-leaf2
  peer_interface: Ethernet49/1
  peer_type: mlag_peer
- name: Ethernet50/1
  description: MLAG_s1-leaf2_Ethernet50/1
  shutdown: false
  channel_group:
    id: 491
    mode: active
  peer: s1-leaf2
  peer_interface: Ethernet50/1
  peer_type: mlag_peer
- name: Ethernet51/1
  description: P2P_s1-spine1_Ethernet1/1
  shutdown: false
  mtu: 9214
  ip_address: 172.16.1.1/31
  peer: s1-spine1
  peer_interface: Ethernet1/1
  peer_type: spine
  switchport:
    enabled: false
- name: Ethernet52/1
  description: P2P_s1-spine2_Ethernet1/1
  shutdown: false
  mtu: 9214
  ip_address: 172.16.1.3/31
  peer: s1-spine2
  peer_interface: Ethernet1/1
  peer_type: spine
  switchport:
    enabled: false
hostname: s1-leaf1
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.250.1.3/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.255.1.3/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.12/24
  type: oob
metadata:
  is_deployed: true
  platform: 7050SX3
  pod_name: S1-POD01
  dc_name: SITE1
  fabric_name: SITE1_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: SITE1
    - name: topology_hint_fabric
      value: SITE1_FABRIC
    - name: topology_hint_pod
      value: S1-POD01
    - name: topology_hint_type
      value: leaf
    - name: topology_hint_rack
      value: S1_RACK1
mlag_configuration:
  domain_id: S1_RACK1
  local_interface: Vlan4094
  peer_address: 10.251.1.1
  peer_link: Port-Channel491
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel491
  description: MLAG_s1-leaf2_Port-Channel491
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.250.1.0/24 eq 32
  - sequence: 20
    action: permit 10.255.1.0/24 eq 32
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.250.1.3
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    type: ipv4
    remote_as: '65101'
    description: s1-leaf2
    next_hop_self: true
    send_community: all
    maximum_routes: 12000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.252.1.1
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    peer: s1-leaf2
    description: s1-leaf2_Vlan4093
  - ip_address: 172.16.1.0
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    peer: s1-spine1
    description: s1-spine1_Ethernet1/1
  - ip_address: 172.16.1.2
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    peer: s1-spine2
    description: s1-spine2_Ethernet1/1
  - ip_address: 10.250.1.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    peer: s1-spine1
    description: s1-spine1_Loopback0
  - ip_address: 10.250.1.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    peer: s1-spine2
    description: s1-spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ip_address: 10.252.1.0/31
  mtu: 9214
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.251.1.0/31
  mtu: 9214
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  tenant: system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  tenant: system
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: s1-leaf1_VTEP
    vxlan:
      source_interface: Loopback0
      mlag_source_interface: Loopback1
      udp_port: 4789
      virtual_router_encapsulation_mac_address: mlag-system-id

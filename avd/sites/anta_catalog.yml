---
anta.tests.software:
  - VerifyEOSVersion: # Verifies the device is running one of the allowed EOS version.
      versions: # List of allowed EOS versions.
        - 4.25.4M
        - 4.26.1F
        - '4.34.2F-43237028.4342F (engineering build)'
        - 4.35.1F-45319759.4351F (engineering build)
        - 4.35.2F-46221466.4352F (engineering build)
        - 4.36.0.1F-47425148.43601F (engineering build)
        - 4.30.10M-41613166.43010M (engineering build)
  - VerifyTerminAttrVersion:
      versions:
        - v1.22.1
        - v1.40.0
        - v1.42.0
        - v1.43.0
        - v1.44.0
        - v1.28.10

anta.tests.system:
  - VerifyUptime: # Verifies the device uptime is higher than a value.
      minimum: 1
  - VerifyNTP:

anta.tests.routing:
  generic:
    - VerifyIPv4RouteType:
        routes_entries:
          - prefix: 10.20.20.200/32
            vrf: PROD
            route_type: eBGP
        filters:
          tags: ['site1']
    - VerifyIPv4RouteType:
        routes_entries:
          - prefix: 10.20.20.100/32
            vrf: PROD
            route_type: eBGP
        filters:
          tags: ['site2']

anta.tests.mlag:
  - VerifyMlagStatus:
      filters:
        tags: ['mlag']
  - VerifyMlagInterfaces:
      filters:
          tags: ['mlag']

anta.tests.connectivity:
  - VerifyReachability:
      hosts:
        - source: Management1
          destination: 8.8.8.8
          vrf: mgmt
          df_bit: True
          size: 100
          reachable: true

